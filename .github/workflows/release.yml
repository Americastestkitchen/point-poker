# Pushing a version tag (v1.2.3) on main publishes a GitHub Release and
# deploys production: https://point-poker.fly.dev
# Create the tag with `npm run release` (see CONTRIBUTING.md).
name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    environment:
      name: production
      url: https://point-poker.fly.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tags must point at a commit on main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # Dealers sign in with Jira (see CONTRIBUTING.md). TOKEN_KEY_PROD seals their logins on the
      # volume: it must stay the same, or everyone is signed out. Staged: the deploy applies them.
      - name: Set the Jira sign-in secrets
        if: env.ATLASSIAN_CLIENT_ID != ''
        run: |
          [ -n "$TOKEN_KEY" ] || { echo "::error::Set the TOKEN_KEY_PROD secret first"; exit 1; }
          flyctl secrets set --config fly.toml --stage \
            ATLASSIAN_CLIENT_ID="$ATLASSIAN_CLIENT_ID" \
            ATLASSIAN_CLIENT_SECRET="$ATLASSIAN_CLIENT_SECRET" \
            JIRA_SITES="$JIRA_SITES" \
            TOKEN_KEY="$TOKEN_KEY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}
          ATLASSIAN_CLIENT_ID: ${{ secrets.ATLASSIAN_CLIENT_ID }}
          ATLASSIAN_CLIENT_SECRET: ${{ secrets.ATLASSIAN_CLIENT_SECRET }}
          JIRA_SITES: ${{ secrets.JIRA_SITES }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY_PROD }}
      - name: Deploy production
        run: flyctl deploy --remote-only --ha=false --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}
      - name: Publish GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
