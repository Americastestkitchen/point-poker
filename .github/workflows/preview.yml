# Every pull request gets its own throwaway site: https://point-poker-pr-<number>.fly.dev
# It's created when the PR opens, redeployed on every push, and deleted when the PR closes.
# Previews have no Jira connection (type tickets in by hand).
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  APP: point-poker-pr-${{ github.event.number }}
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PREVIEW }}
  FLY_ORG: personal
  MARKER: "<!-- point-poker-preview -->"

jobs:
  # One job for the whole PR lifecycle: deploy while the PR is open, delete when it closes.
  preview:
    runs-on: ubuntu-latest
    env:
      OPEN: ${{ github.event.action != 'closed' }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # PR open: build, check, deploy, and comment the link.
      - uses: actions/checkout@v4
        if: env.OPEN == 'true'
      - uses: actions/setup-node@v4
        if: env.OPEN == 'true'
        with:
          node-version: 26
          cache: npm
      - if: env.OPEN == 'true'
        run: npm ci
      - if: env.OPEN == 'true'
        run: npm run check
      - name: Create the preview app (first push only)
        if: env.OPEN == 'true'
        run: flyctl status -a "$APP" >/dev/null 2>&1 || flyctl apps create "$APP" --org "$FLY_ORG"
      - name: Set the host passcode, or Jira sign-in through the dev site
        if: env.OPEN == 'true'
        run: |
          # PREVIEW_SIGN_IN=own: the preview's own callback (add it to the Atlassian app), for
          # testing sign-in before the dev site relays it. Otherwise through the dev site.
          if [ "$PREVIEW_SIGN_IN" = own ]; then CALLBACK="https://$APP.fly.dev/auth/jira/callback"
          else CALLBACK="https://point-poker-dev.fly.dev/auth/jira/callback"; fi
          if [ -n "$ATLASSIAN_CLIENT_ID" ]; then
            flyctl secrets set -a "$APP" --stage \
              ATLASSIAN_CLIENT_ID="$ATLASSIAN_CLIENT_ID" \
              ATLASSIAN_CLIENT_SECRET="$ATLASSIAN_CLIENT_SECRET" \
              ATLASSIAN_CALLBACK_URL="$CALLBACK" \
              JIRA_SITES="$JIRA_SITES"
          else
            flyctl secrets set HOST_PASSCODE="$HOST_PASSCODE" -a "$APP" --stage
          fi
        env:
          HOST_PASSCODE: ${{ secrets.HOST_PASSCODE }}
          ATLASSIAN_CLIENT_ID: ${{ secrets.ATLASSIAN_CLIENT_ID }}
          ATLASSIAN_CLIENT_SECRET: ${{ secrets.ATLASSIAN_CLIENT_SECRET }}
          JIRA_SITES: ${{ secrets.JIRA_SITES }}
          PREVIEW_SIGN_IN: ${{ vars.PREVIEW_SIGN_IN }}
      - name: Deploy
        if: env.OPEN == 'true'
        run: flyctl deploy --remote-only --ha=false --config fly.dev.toml -a "$APP"
      - name: Comment the link on the PR
        if: env.OPEN == 'true'
        run: |
          body="$MARKER
          🃏 **Preview:** https://$APP.fly.dev
          Updated for \`${HEAD_SHA::7}\`. It sleeps when idle and is deleted when this PR closes. No Jira here, so type tickets in by hand."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.number }}/comments" --paginate -q ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else gh pr comment ${{ github.event.number }} --body "$body"; fi
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # PR closed: delete the app and note it on the PR.
      - name: Delete the preview app
        if: env.OPEN != 'true'
        run: flyctl apps destroy "$APP" --yes || echo "Nothing to delete"
      - name: Note it on the PR
        if: env.OPEN != 'true'
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.number }}/comments" --paginate -q ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          [ -n "$id" ] && gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$MARKER
          🃏 Preview deleted (PR closed)." >/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
