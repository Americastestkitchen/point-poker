# Every push to main goes live on the dev site, https://point-poker-dev.fly.dev
# (production only updates when you cut a release)
name: Deploy dev

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment:
      name: dev
      url: https://point-poker-dev.fly.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # Dealers sign in with Jira (see CONTRIBUTING.md). The dev site keeps no volume, so no
      # TOKEN_KEY: sign-ins last until it sleeps. Staged: the deploy below applies them.
      - name: Set the Jira sign-in secrets
        if: env.ATLASSIAN_CLIENT_ID != ''
        run: |
          flyctl secrets set --config fly.dev.toml --stage \
            ATLASSIAN_CLIENT_ID="$ATLASSIAN_CLIENT_ID" \
            ATLASSIAN_CLIENT_SECRET="$ATLASSIAN_CLIENT_SECRET" \
            JIRA_SITES="$JIRA_SITES"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}
          ATLASSIAN_CLIENT_ID: ${{ secrets.ATLASSIAN_CLIENT_ID }}
          ATLASSIAN_CLIENT_SECRET: ${{ secrets.ATLASSIAN_CLIENT_SECRET }}
          JIRA_SITES: ${{ secrets.JIRA_SITES }}
      - run: flyctl deploy --remote-only --ha=false --config fly.dev.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}
