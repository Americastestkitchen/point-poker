# Point Poker DEV on Fly.io (deployed on every push to main).
# Still exactly ONE machine (tables live in memory), but it may sleep when idle.
# The Atlassian app's credentials and HOST_PASSCODE are Fly secrets (`fly secrets set`), not here.

app = "point-poker-dev"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  # PR previews and local runs sign in to Jira through this site's callback, so the Atlassian
  # app only needs dev's and production's; it passes each sign-in on to where it started.
  # Only a one-time code passes, and trading it for tokens takes the client secret, which
  # stays where the sign-in started. Previews share this file: harmless there.
  ATLASSIAN_RELAY = '^(https://point-poker-pr-\d+\.fly\.dev|http://localhost(:\d+)?|https://[a-z0-9-]+\.[a-z0-9-]+\.ts\.net(:\d+)?)$'

[http_service]
  internal_port = 8080
  force_https = true
  # dev may sleep when idle (tables are wiped then; fine for testing)
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
