# Point Poker on Fly.io.
# Exactly ONE machine that never sleeps: tables live in memory, so a second
# machine would split players. Tables are saved to the /data volume, so they
# survive deploys and restarts.
# The Atlassian app's credentials and TOKEN_KEY are Fly secrets (`fly secrets set`), not here.

app = "point-poker"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "pp_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
